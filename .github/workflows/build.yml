name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ContinuumFX-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ContinuumFX-build${{ github.run_number }}
          path: dist/*.apk

      # Every push to main also publishes a pre-release, so the APK can be
      # downloaded straight to a phone from the Releases page.
      - name: Publish pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Continuum FX · build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic build of `${{ github.sha }}`.
            Install the APK below, then open the app and follow the setup steps.
          files: dist/*.apk
