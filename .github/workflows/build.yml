name: Build APK

on:
  push:
    branches: [ main ]
    # The keyboard has its own workflow.
    paths-ignore:
      - 'keyboard/**'
      - '.github/workflows/keyboard.yml'
      - '.gitmodules'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log

      # Surfaces compiler errors as annotations, so they can be read from the
      # checks API without downloading the full log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          { grep -E '^e: |^ERROR|error:' build.log || true; grep -A6 'What went wrong' build.log || true; } \
            | sed "s#file://$GITHUB_WORKSPACE/##" | head -80 > errors.txt
          split -l 8 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::error title=Build error::$msg"
          done

      # Releases must be signed with the app's own key, or phones can't update in place.
      - name: Check the signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error title=Signing password missing::Add the SIGNING_PASSWORD repository secret (Settings, Secrets and variables, Actions) so builds update in place."
            exit 1
          fi

      - name: Release notes
        shell: bash
        run: |
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          cat notes.md

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ContinuumFX-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ContinuumFX-build${{ github.run_number }}
          path: dist/*.apk

      # Every push to main also publishes a pre-release, so the APK can be
      # downloaded straight to a phone from the Releases page.
      - name: Publish pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Continuum FX · build ${{ github.run_number }}
          prerelease: true
          body_path: notes.md
          files: dist/*.apk
