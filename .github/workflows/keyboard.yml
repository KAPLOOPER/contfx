name: Build keyboard

on:
  push:
    branches: [ main ]
    paths:
      - 'keyboard/**'
      - '.github/workflows/keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The run number is the build number, so each build installs over the last one.
      # Signed with the same key as Continuum FX.
      - name: Test and build
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then echo "::error title=Signing password missing::Add the SIGNING_PASSWORD secret."; exit 1; fi
          chmod +x gradlew
          ./gradlew -p keyboard --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          { grep -E '^e: |^ERROR|error:|FAILED|AssertionError|Test.*FAILED' build.log || true; grep -A8 'What went wrong' build.log || true; } \
            | sed "s#file://$GITHUB_WORKSPACE/##" | head -80 > errors.txt
          for r in keyboard/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$r" ] && grep -A3 '<failure' "$r" | head -12 >> errors.txt
          done
          split -l 8 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::error title=Build error::$msg"
          done

      - name: Report test results
        if: always()
        shell: bash
        run: |
          out=$(grep -h -o 'words [0-9-]*:.*\|swipe [0-9-]*:[^;]*' keyboard/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -8 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$out" ] && echo "::notice title=Word engine::$out" || true

      - name: Collect the APK
        shell: bash
        run: |
          mkdir -p dist
          apk=$(ls keyboard/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "dist/ContinuumKeyboard-${{ github.run_number }}.apk"
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ContinuumKeyboard-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-${{ github.run_number }}
          name: Continuum Keyboard · build ${{ github.run_number }}
          prerelease: true
          body_path: notes.md
          files: dist/*.apk
